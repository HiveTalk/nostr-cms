name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx --no-install tsc --noEmit
      - run: npx --no-install eslint .
      - run: npx --no-install vitest run --reporter=dot --silent
      - run: npx --no-install vite build -l error
      - run: node scripts/generate-route-meta.mjs
      - run: cp dist/index.html dist/404.html
